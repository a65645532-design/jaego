<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이닝사운드 재고장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
  :root{
    --ground:#F6F2EA;
    --surface:#FDFBF5;
    --surface-2:#F0E9DA;
    --ink:#262014;
    --ink-dim:#6F6656;
    --line:rgba(40,30,15,.13);
    --line-soft:rgba(40,30,15,.07);
    --brand:#8A6A38;
    --brand-soft:#EFE4D0;
    --danger:#AE3C25;
    --danger-bg:#F6E4DD;
    --ok:#4C7A5B;
    --open:#3C6E8E;
    --open-bg:#E4EDF2;
    --shadow:0 1px 2px rgba(40,30,15,.05), 0 10px 30px rgba(40,30,15,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#15120D;
      --surface:#201B14;
      --surface-2:#2A2319;
      --ink:#ECE5D7;
      --ink-dim:#9B9181;
      --line:rgba(198,165,112,.17);
      --line-soft:rgba(198,165,112,.08);
      --brand:#C6A570;
      --brand-soft:#332818;
      --danger:#E17A60;
      --danger-bg:#331F19;
      --ok:#7EAA8B;
      --open:#84ADC9;
      --open-bg:#1A2932;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#15120D;
    --surface:#201B14;
    --surface-2:#2A2319;
    --ink:#ECE5D7;
    --ink-dim:#9B9181;
    --line:rgba(198,165,112,.17);
    --line-soft:rgba(198,165,112,.08);
    --brand:#C6A570;
    --brand-soft:#332818;
    --danger:#E17A60;
    --danger-bg:#331F19;
    --ok:#7EAA8B;
    --open:#84ADC9;
    --open-bg:#1A2932;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
    line-height:1.55; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    letter-spacing:-0.005em;
  }
  button{font-family:inherit; cursor:pointer; color:inherit}
  input,select{font-family:inherit; font-size:15px; color:var(--ink)}
  :focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

  .wrap{max-width:580px; margin:0 auto; min-height:100vh; background:var(--ground)}

  /* app bar + tabs */
  .appbar{display:flex; align-items:center; gap:9px; padding:13px 18px 9px}
  .appbar b{font-weight:700; font-size:16px; letter-spacing:-.02em}
  .appbar .sound{color:var(--brand)}
  .modebadge{
    font-size:10.5px; font-weight:700; letter-spacing:.01em; padding:3px 8px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink-dim); white-space:nowrap;
  }
  body.owner .modebadge{ background:var(--brand-soft); border-color:var(--brand); color:var(--brand) }
  .synced{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-dim)}
  .owner-only{ display:none !important }
  body.owner .owner-only{ display:revert !important }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-dim); flex:none}
  .dot.on{background:var(--ok)} .dot.wait{background:var(--brand)} .dot.off{background:var(--danger)}

  .tabnav{display:flex; gap:4px; padding:0 14px; border-bottom:1px solid var(--line)}
  .tabnav button{
    background:none; border:0; padding:11px 14px; font-size:14px; font-weight:700; color:var(--ink-dim);
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tabnav button.on{color:var(--ink); border-bottom-color:var(--brand)}

  .whobar{display:flex; align-items:center; gap:8px; padding:11px 18px; font-size:13px; color:var(--ink-dim); border-bottom:1px solid var(--line-soft)}
  .whobar input{
    flex:1; max-width:200px; padding:7px 10px; border:1px solid var(--line);
    border-radius:8px; background:var(--surface); font-size:13px;
  }
  .whobar input.need{border-color:var(--danger); background:var(--danger-bg)}

  /* summary */
  .summary{display:flex; gap:10px; padding:4px 18px 14px}
  .stat{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; text-align:left; box-shadow:var(--shadow);
  }
  .stat .n{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
  .stat .l{font-size:11.5px; color:var(--ink-dim); margin-top:2px}
  .stat.danger .n{color:var(--danger)}
  .stat.open .n{color:var(--open)}
  .stat[aria-pressed="true"]{border-color:var(--brand); box-shadow:0 0 0 1px var(--brand) inset, var(--shadow)}

  /* filters */
  .filters{
    position:sticky; top:0; z-index:20; background:var(--ground);
    padding:10px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:9px;
  }
  .search{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); font-size:14px;
  }
  .chips{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; padding:6px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-dim); font-size:12.5px; font-weight:500;
  }
  .chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:700}
  :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1c160d}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1c160d}}

  /* list */
  .cat{
    font-weight:700; font-size:12px; letter-spacing:.04em; color:var(--brand);
    padding:18px 18px 8px; position:sticky; top:99px; background:var(--ground); z-index:10;
  }
  .row{
    display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center;
    padding:12px 18px 12px 18px; border-bottom:1px solid var(--line-soft); position:relative;
  }
  .row::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
  .row.short::before{background:var(--danger)}
  .rname{font-size:15px; font-weight:500; cursor:pointer}
  .rname .caret{color:var(--ink-dim); font-size:11px; margin-left:5px}
  .rmeta{grid-column:1; font-size:11.5px; color:var(--ink-dim); display:flex; gap:7px; flex-wrap:wrap; align-items:center}
  .badge{font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:5px}
  .badge.short{background:var(--danger-bg); color:var(--danger)}
  .badge.open{background:var(--open-bg); color:var(--open)}

  .ctrls{grid-row:1 / span 2; grid-column:2; display:flex; align-items:center; gap:10px}
  .stepper{display:flex; align-items:center; gap:2px; background:var(--surface-2); border-radius:10px; padding:3px}
  .stepper button{
    width:34px; height:34px; border:0; border-radius:8px; background:var(--surface);
    font-size:19px; font-weight:700; line-height:1; display:grid; place-items:center; box-shadow:var(--shadow);
  }
  .stepper button:active{transform:scale(.92)}
  .stepper .val{
    min-width:30px; text-align:center; font-size:17px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .opentog{
    width:44px; height:34px; border:1px solid var(--line); border-radius:9px; background:var(--surface);
    font-size:11px; font-weight:700; color:var(--ink-dim); letter-spacing:.03em;
  }
  .opentog[aria-pressed="true"]{background:var(--open-bg); border-color:var(--open); color:var(--open)}

  .empty{padding:60px 24px; text-align:center; color:var(--ink-dim); font-size:14px}

  /* offline banner */
  .banner{margin:14px 18px; padding:12px 14px; background:var(--danger-bg); border:1px solid var(--danger);
    border-radius:10px; font-size:12.5px; color:var(--danger)}

  /* footer actions */
  .foot{padding:22px 18px 130px}
  .foot h2{font-weight:700; font-size:12px; letter-spacing:.04em; color:var(--brand); margin:0 0 10px}
  .log{list-style:none; margin:0; padding:0}
  .log li{font-size:12px; color:var(--ink-dim); padding:6px 0; border-bottom:1px solid var(--line-soft); display:flex; gap:8px}
  .log li b{color:var(--ink); font-weight:500; flex:none}
  .log li .t{margin-left:auto; flex:none; font-variant-numeric:tabular-nums}
  .linkbtn{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; color:var(--brand-ink); font-size:13.5px; font-weight:700; padding:13px 14px; margin-top:8px}
  .linkbtn:active{background:var(--surface-2)}

  /* FAB */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:40; width:min(548px, calc(100vw - 32px));
    display:flex; gap:10px;
  }
  .fab button{
    flex:1; padding:14px; border:0; border-radius:13px; font-size:14px; font-weight:700;
    background:var(--brand); color:#fff; box-shadow:0 8px 24px rgba(40,30,15,.28);
  }
  :root:not([data-theme="light"]) .fab button{color:#1c160d}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab button{color:#1c160d}}
  .fab button.ghost{
    flex:none; width:52px; background:var(--surface); color:var(--brand); border:1px solid var(--line);
  }

  /* sheet */
  .scrim{position:fixed; inset:0; background:rgba(15,11,6,.5); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s}
  .scrim.on{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:50%; transform:translate(-50%,100%); bottom:0; z-index:51;
    width:min(580px,100vw); background:var(--surface); border-radius:20px 20px 0 0;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom)); transition:transform .24s cubic-bezier(.4,0,.2,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet.on{transform:translate(-50%,0)}
  .grab{width:36px; height:4px; border-radius:99px; background:var(--line); margin:6px auto 16px}
  .sheet h3{margin:0 0 4px; font-size:17px}
  .sheet .sub{font-size:12.5px; color:var(--ink-dim); margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-dim); margin-bottom:6px}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--ground);
  }
  .field textarea{min-height:54px; resize:vertical; line-height:1.5}
  .row2{display:flex; gap:10px}
  .row2 .field{flex:1}
  .kv{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--ink-dim)}
  .kv b{color:var(--ink); font-weight:500}
  .costbox{background:var(--brand-soft); border:1px solid var(--brand); border-radius:12px; padding:14px; margin:4px 0 16px}
  .costbox .ct{font-size:12px; font-weight:700; color:var(--brand); margin-bottom:9px; letter-spacing:.02em}
  .costbox input{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--ground)}
  .costbox .margin{display:flex; justify-content:space-between; font-size:12.5px; margin-top:9px; color:var(--ink-dim)}
  .costbox .margin b{color:var(--ok); font-weight:700}
  .costbox .margin b.low{color:var(--danger)}
  .minset{display:flex; align-items:center; gap:10px}
  .minset button{width:36px; height:36px; border:1px solid var(--line); border-radius:9px; background:var(--ground); font-size:18px; font-weight:700}
  .minset .v{font-size:16px; font-weight:700; min-width:26px; text-align:center; font-variant-numeric:tabular-nums}
  .savebtn{width:100%; padding:14px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-weight:700; font-size:15px; margin-top:4px}
  :root:not([data-theme="light"]) .savebtn{color:#1c160d}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .savebtn{color:#1c160d}}
  .delbtn{width:100%; padding:12px; border:1px solid var(--danger); border-radius:12px; background:transparent; color:var(--danger); font-weight:700; font-size:13.5px; margin-top:10px}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%,14px); z-index:60;
    background:var(--ink); color:var(--ground); padding:11px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:all .2s; max-width:86vw; text-align:center; box-shadow:var(--shadow);
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}

  /* tables view */
  .tblhead{padding:16px 18px 10px; font-size:12.5px; color:var(--ink-dim); font-weight:500}
  .tblhead #tbl-sum{color:var(--ink); font-weight:700}
  .tblgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px 8px}
  @media (max-width:400px){ .tblgrid{grid-template-columns:repeat(2,1fr)} }
  .tblcell{
    aspect-ratio:1/1; border:1px solid var(--line); border-radius:14px; background:var(--surface);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    box-shadow:var(--shadow); padding:8px;
  }
  .tblcell .tn{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
  .tblcell .te{font-size:11px; color:var(--ink-dim)}
  .tblcell .tt{font-size:14px; font-weight:800; color:var(--brand); font-variant-numeric:tabular-nums}
  .tblcell .tc{font-size:10.5px; color:var(--ink-dim)}
  .tblcell.occ{border-color:var(--brand); background:var(--brand-soft)}
  .tblcell:active{transform:scale(.96)}

  .tline{display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft)}
  .tline .tl-n{font-size:13.5px}
  .tline .tl-opt{font-size:11px; color:var(--ink-dim)}
  .tline .tl-q{display:flex; align-items:center; gap:3px; background:var(--surface-2); border-radius:8px; padding:2px}
  .tline .tl-q button{width:28px; height:28px; border:0; border-radius:6px; background:var(--surface); font-size:15px; font-weight:700; box-shadow:var(--shadow)}
  .tline .tl-q span{min-width:20px; text-align:center; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
  .tline .tl-a{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:58px; text-align:right}
  .tline .tl-x{width:26px; height:26px; border:0; background:none; color:var(--ink-dim); font-size:13px}
  .kv.tot{border-top:1px dashed var(--line); padding-top:10px; font-weight:800}
  .kv.tot span:last-child{color:var(--brand)}

  .pick-item{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line-soft); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left}
  .pick-item .pi-n{flex:1; font-size:13.5px}
  .pick-item .pi-p{font-size:12.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums}

  /* sales calendar */
  .calnav{display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px}
  .calnav button{background:var(--surface); border:1px solid var(--line); border-radius:9px; width:34px; height:34px; font-size:17px; color:var(--ink)}
  .calnav b{font-size:15.5px; font-variant-numeric:tabular-nums}
  .calsum{display:flex; gap:7px; margin-bottom:12px}
  .calsum > div{flex:1; background:var(--surface-2); border-radius:10px; padding:8px 6px; text-align:center}
  .calsum .l{font-size:10px; color:var(--ink-dim)}
  .calsum .v{font-size:12.5px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px}
  .caldow{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px}
  .caldow span{text-align:center; font-size:10px; color:var(--ink-dim)}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  .calcell{aspect-ratio:1/1.08; border:1px solid var(--line-soft); border-radius:8px; background:var(--surface); display:flex; flex-direction:column; align-items:center; padding:3px 1px; gap:1px; overflow:hidden}
  .calcell.empty{border:0; background:none}
  .calcell .cd{font-size:10.5px; color:var(--ink-dim); line-height:1}
  .calcell.has{border-color:var(--brand); background:var(--brand-soft)}
  .calcell.has .cd{color:var(--ink); font-weight:700}
  .calcell .ct{font-size:9px; font-weight:800; color:var(--brand-ink); font-variant-numeric:tabular-nums; line-height:1.05}

  /* 근태 */
  .attwrap{padding:22px 18px 40px}
  .attclock{text-align:center; font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.01em; line-height:1}
  .attdate{text-align:center; font-size:13px; color:var(--ink-dim); margin:6px 0 22px}
  .attme{text-align:center; font-size:13px; color:var(--ink-dim); margin-bottom:12px}
  .attme b{color:var(--ink)}
  .attbtns{display:flex; gap:12px; margin-bottom:24px}
  .attbtns button{flex:1; padding:24px 0; border:0; border-radius:18px; font-size:18px; font-weight:800; color:#fff; box-shadow:var(--shadow)}
  .attbtns .in{background:var(--ok)}
  .attbtns .out{background:var(--danger)}
  .attbtns button:active{transform:scale(.97)}
  .atth2{font-weight:700; font-size:12px; letter-spacing:.04em; color:var(--brand); margin:6px 0 8px}
  .attrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px}
  .attrow .tag{font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:5px}
  .attrow .tag.in{background:var(--good-wash); color:var(--ok)}
  .attrow .tag.out{background:var(--danger-bg); color:var(--danger)}
  .attrow .t{margin-left:auto; color:var(--ink-dim); font-variant-numeric:tabular-nums}

  /* PIN 잠금 화면 */
  #gate{position:fixed; inset:0; z-index:200; background:var(--ground); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center}
  #gate.hidden{display:none}
  #gate .g-mark{width:52px; height:52px; border-radius:14px; background:var(--brand); color:#fff; display:grid; place-items:center; font-size:26px; font-weight:800; margin-bottom:16px}
  #gate h1{font-size:19px; font-weight:800; letter-spacing:-.02em; margin:0 0 4px}
  #gate p{font-size:13px; color:var(--ink-dim); margin:0 0 24px}
  #gate .g-pin{width:200px; text-align:center; font-size:24px; letter-spacing:.3em; font-weight:700; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink)}
  #gate .g-pin.wrong{border-color:var(--danger); background:var(--danger-bg)}
  #gate .g-go{margin-top:14px; width:200px; padding:13px; border:0; border-radius:12px; background:var(--brand); color:#fff; font-size:15px; font-weight:800}
  :root:not([data-theme="light"]) #gate .g-mark, :root:not([data-theme="light"]) #gate .g-go{color:#1c160d}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #gate .g-mark, :root:not([data-theme="light"]) #gate .g-go{color:#1c160d}}
  #gate .g-hint{margin-top:20px; font-size:11.5px; color:var(--ink-dim); max-width:260px; line-height:1.6}
</style>
</head>
<body>
<div id="gate">
  <div class="g-mark">π</div>
  <h1>다이닝사운드 재고장부</h1>
  <p id="g-msg">연결 중…</p>
  <input id="g-pin" class="g-pin" type="tel" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••" hidden>
  <button class="g-go" id="g-go" hidden>들어가기</button>
  <div class="g-hint" id="g-hint"></div>
</div>

<div class="wrap">
  <div class="appbar">
    <b>다이닝<span class="sound">사운드</span></b>
    <span class="synced"><span class="dot" id="dot"></span><span id="syncmsg">연결 중</span></span>
    <span class="modebadge" id="modebadge" title="이 페이지를 만든 사람(사장)만 원가·매출·메뉴가격을 봅니다">확인 중</span>
  </div>
  <div class="tabnav">

      var btn = (!list.length && !seedingActive && db) ? '<div><button class="linkbtn" id="reseed">기준 재고 불러오기</button></div>' : '';
      el.innerHTML = '<div class="empty">'+msg+btn+'</div>';
      var rb=$("reseed"); if(rb) rb.onclick=function(){ runSeed(true); };
      return;
    }
    var html="", curCat=null;
    view.forEach(function(it){
      if(it.cat!==curCat){ curCat=it.cat; html += '<div class="cat">'+esc(CAT_KO[it.cat]||it.cat)+'</div>'; }
      html += rowHTML(it);
    });
    el.innerHTML = html;

  }

  function rowHTML(it){
    var sid = "s_"+it.id;
    var badges = "";
    if(isShort(it)) badges += '<span class="badge short">발주 · 최소 '+(it.min)+'</span>';
    if(it.open){
      var od = openDays(it.openedAt);
      badges += '<span class="badge open">오픈'+(od!=null? " "+dayLabel(it.openedAt)+"~ ("+od+"일째)" : " 중")+'</span>';
    }
    var priceBit = it.form==="GLASS ONLY" || it.form==="단일가"
      ? (it.glass!=null? won(it.glass)+" / 잔" : "")
      : (it.bottle!=null? won(it.bottle) : (it.glass!=null? won(it.glass)+" / 잔":""));

    '<div class="row'+(isShort(it)?" short":"")+'">'+
      '<div class="rname" data-act="detail" data-id="'+it.id+'" role="button" tabindex="0">'+
        esc(it.name)+'<span class="caret">›</span></div>'+
      '<div class="rmeta">'+
        (it.brand && it.brand!=="Additional" && it.brand!=="Draft" && it.brand!=="Soft Drink" && it.brand!=="Non-Alcoholic Beer" && it.brand!=="Champagne & Sparkling" && it.brand!=="White" && it.brand!=="Red" && it.brand!=="Dessert Wine" ? '<span>'+esc(it.brand)+'</span>' : '')+
        (priceBit? '<span>'+priceBit+'</span>':'')+
        badges +
      '</div>'+
      '<div class="ctrls">'+
        '<div class="stepper">'+
          '<button data-act="dec" data-id="'+it.id+'" aria-label="빼기">−</button>'+
          '<span class="val" id="'+sid+'">'+(pend[it.id]!=null?pend[it.id]:(it.stock||0))+'</span>'+
          '<button data-act="inc" data-id="'+it.id+'" aria-label="더하기">+</button>'+
        '</div>'+
        '<button class="opentog" data-act="open" data-id="'+it.id+'" aria-pressed="'+(!!it.open)+'" title="개봉한 병 있음">오픈</button>'+
      '</div>'+
    '</div>';

  function renderLog(){
    var el=$("log");
    if(!logEntries.length){ el.innerHTML='<li style="border:0;color:var(--ink-dim)">아직 기록이 없어요</li>'; return; }
    el.innerHTML = logEntries.slice(0,25).map(function(e){
      return '<li><b>'+esc(e.who||"?")+'</b><span>'+esc(e.text)+'</span><span class="t">'+timeShort(e.ts)+'</span></li>';
    }).join("");
  }
  function renderCloseLog(){
    var el=$("closelog");
    if(!closings.length){ el.innerHTML='<li style="border:0;color:var(--ink-dim)">아직 마감 기록이 없어요</li>'; return; }
    el.innerHTML = closings.map(function(c){
      var d = c.date ? c.date.slice(5).replace("-","/") : "";
      return '<li><b>'+esc(c.by||"?")+'</b><span>'+d+' 마감'+

  function renderChips(){
    var defs = [["all","전체"]].concat(CAT_SEQ.map(function(c){return [c, CAT_KO[c]];}));
    $("chips").innerHTML = defs.map(function(d){
      return '<button class="chip" data-cat="'+d[0]+'" aria-pressed="'+(filterCat===d[0])+'">'+d[1]+'</button>';
    }).join("");

  // ---------- mutations ----------
  function needName(){
    showToast("상단에 기록자 이름을 먼저 입력해주세요");
    var w=$("who"); w.classList.add("need"); w.focus();
  }
  function bump(id, delta){
    if(!db) return;
    if(!me){ needName(); return; }
    var it = items.find(function(x){return x.id===id;}); if(!it) return;
    var base = pend[id]!=null ? pend[id] : (it.stock||0);
    var nv = Math.max(0, base+delta);
    pend[id]=nv;
    var vEl=$("s_"+id); if(vEl) vEl.textContent=nv;
    clearTimeout(pendT[id]);
    pendT[id]=setTimeout(function(){
      var target=pend[id]; delete pend[id];
      var cur=items.find(function(x){return x.id===id;});
      if(!cur || cur.stock===target) return;
      var from=cur.stock||0;
      db.doc("items/"+id).update({stock:target, updatedAt:nowISO(), updatedBy:me})
        .then(function(){ logStockDelta(cur.name, from, target, "재고 +/-"); })
        .catch(function(){ showToast("저장 실패 · 다시 시도해주세요"); render(); });
    }, 450);
  }
  function setStock(id, val){
    if(!db) return Promise.reject();
    if(!me){ needName(); return Promise.reject(); }
    var it=items.find(function(x){return x.id===id;});
    var nv=Math.max(0, Number(val)||0);
    if(!it || (it.stock||0)===nv) return Promise.resolve();
    var from=it.stock||0;
    return db.doc("items/"+id).update({stock:nv, updatedAt:nowISO(), updatedBy:me})
      .then(function(){ logStockDelta(it.name, from, nv, "직접입력"); });
  }
  function toggleOpen(id){
    if(!db) return;
    if(!me){ needName(); return; }
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    if(it.open) confirmClose(id);   // 소진은 실수 방지를 위해 확인 단계
    else doOpen(id);
  }
  function doOpen(id){
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    var before={open:it.open, openedAt:it.openedAt, openLog:it.openLog};
    var patch={ open:true, openedAt:nowISO(), updatedAt:nowISO(), updatedBy:me };
    db.doc("items/"+id).update(patch).then(function(){
      addLog(it.name+" 새 병 오픈 ("+dayLabel(patch.openedAt)+")");
      showUndoToast(it.name+" 오픈 표시", function(){ undoOpen(id, before, it.name); });
    }).catch(function(){ showToast("저장 실패"); });
  }
  function doClose(id){
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    var before={open:it.open, openedAt:it.openedAt, openLog:it.openLog};
    var entry={ o: it.openedAt||null, c: nowISO(), by: me };
    var patch={ open:false, openedAt:null, openLog:(it.openLog||[]).concat([entry]).slice(-8),
                updatedAt:nowISO(), updatedBy:me };
    db.doc("items/"+id).update(patch).then(function(){
      addLog(it.name+" 오픈 병 소진 처리");
      showUndoToast(it.name+" 소진 처리", function(){ undoOpen(id, before, it.name); });
    }).catch(function(){ showToast("저장 실패"); });
  }
  function confirmClose(id){
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    var b=$("sheetbody");
    b.innerHTML = ''+
      '<h3>오픈 병 소진 처리</h3>'+
      '<div class="sub">'+esc(it.name)+'</div>'+
      '<div class="kv"><span>현재 오픈일</span><b>'+
        (it.openedAt? dayLabel(it.openedAt)+" · "+openDays(it.openedAt)+"일째" : "미기록")+'</b></div>'+
      '<p style="font-size:13px;color:var(--ink);margin:14px 0 6px;line-height:1.6">'+
        '이 병을 다 썼으면 확정하세요. 오픈~소진 기록이 이력으로 저장되고, 다음에 다시 열면 새 날짜로 시작합니다.</p>'+
      '<button class="savebtn" id="cc-yes" style="background:var(--danger)">소진 확정</button>'+
      '<button class="delbtn" id="cc-no" style="border-color:var(--line);color:var(--ink)">취소</button>';
    $("cc-yes").onclick=function(){ closeSheet(); doClose(id); };
    $("cc-no").onclick=closeSheet;
    openSheet();
  }
  // 오픈 경과일
  function openDays(iso){
    if(!iso) return null;
    try{
      var d=new Date(iso); d.setHours(0,0,0,0);
      var t=new Date(); t.setHours(0,0,0,0);
      return Math.round((t-d)/86400000);
    }catch(e){ return null; }
  }
  function dayLabel(iso){
    if(!iso) return "";
    try{ var d=new Date(iso); return (d.getMonth()+1)+"/"+d.getDate(); }catch(e){ return ""; }
  }
  function addLog(text){
    if(!db) return;
    var entry={ts:nowISO(), who:me||"익명", text:text};
    var next=[entry].concat(logEntries).slice(0,80);
    db.doc("meta/log").set({entries:next}).catch(function(){});
  }

  // 상세 시트의 오픈 병 관리 UI (체크 + 오픈 날짜)
  function openControlHTML(it){
    var dv = it.openedAt ? localISO(new Date(it.openedAt)) : localISO(new Date());
    return ''+
    '<div class="field"><label>오픈 병 관리</label>'+
      '<label style="display:flex;align-items:center;gap:9px;font-size:14px;font-weight:400;margin-bottom:9px;cursor:pointer">'+
        '<input type="checkbox" id="d-open" '+(it.open?"checked":"")+' style="width:18px;height:18px;accent-color:var(--brand)">'+
        '지금 개봉한 병이 있음</label>'+
      '<input id="d-opened" type="date" value="'+dv+'" '+(it.open?"":"disabled")+'>'+
      '<div style="font-size:11px;color:var(--ink-dim);margin-top:5px">'+
        (it.open && it.openedAt ? '현재 '+openDays(it.openedAt)+'일째 · ' : '')+
        '병을 다 쓰면 체크 해제하세요 → 오픈~소진 이력으로 저장됩니다</div>'+
      '<div id="d-open-warn" hidden style="font-size:11.5px;color:var(--danger);font-weight:600;margin-top:7px">'+
        '⚠ 저장하면 '+(it.openedAt?dayLabel(it.openedAt):"")+'~오늘 오픈 기록이 이력으로 넘어갑니다</div>'+
    '</div>';
  }
  function wireOpenControl(it){
    var chk=$("d-open"), dt=$("d-opened"), warn=$("d-open-warn");
    if(!chk||!dt) return;
    function sync(){
      dt.disabled=!chk.checked; dt.style.opacity=chk.checked?1:.4;
      if(warn) warn.hidden = !(it && it.open && !chk.checked);
    }
    chk.addEventListener("change", sync);
    sync();
  }
  // 체크/날짜 상태를 현재 item과 비교해 items 문서에 적용할 패치 반환 (없으면 null)
  function collectOpenPatch(it){
    var chk=$("d-open"); if(!chk) return null;
    var want=chk.checked, dv=$("d-opened").value;
    if(want && !it.open){
      return { open:true, openedAt: dv? new Date(dv+"T12:00:00").toISOString() : nowISO() };
    }
    if(!want && it.open){
      var entry={ o: it.openedAt||null, c: nowISO(), by: me };
      return { open:false, openedAt:null, openLog:(it.openLog||[]).concat([entry]).slice(-8) };
    }
    if(want && it.open && dv){
      var cur = it.openedAt ? localISO(new Date(it.openedAt)) : "";
      if(cur!==dv) return { openedAt: new Date(dv+"T12:00:00").toISOString() };
    }
    return null;
  }
  function openActionText(op, name){
    if(!op) return "";
    if(op.open===true) return name+" 새 병 오픈 ("+dayLabel(op.openedAt)+")";
    if(op.open===false) return name+" 오픈 병 소진 처리";
    if(op.openedAt) return name+" 오픈일 "+dayLabel(op.openedAt)+"로 수정";
    return "";
  }
  function logOpenPatch(name, op){ var t=openActionText(op,name); if(t) addLog(t); }

  // 오픈 상태 변경을 이전 값으로 되돌린다
  function undoOpen(id, before, name){
    if(!db) return;
    db.doc("items/"+id).update({
      open: !!before.open, openedAt: before.openedAt||null, openLog: before.openLog||[],
      updatedAt: nowISO(), updatedBy: me
    }).then(function(){ addLog(name+" 오픈 상태 되돌림"); showToast("되돌렸어요"); })
      .catch(function(){ showToast("되돌리기 실패"); });
  }

  function openHistoryHTML(it){
    var log=(it.openLog||[]).slice().reverse();
    if(!log.length) return "";
    return '<div style="font-size:11.5px;font-weight:700;color:var(--ink-dim);margin:14px 0 4px">지난 오픈 이력</div>'+
      log.map(function(e){
        var span=(e.o && e.c)? Math.max(0, Math.round((new Date(e.c)-new Date(e.o))/86400000)) : null;
        return '<div class="kv"><span>'+(e.o?dayLabel(e.o):"?")+' 오픈 → '+(e.c?dayLabel(e.c):"?")+' 소진'+(e.by?" ("+esc(e.by)+")":"")+'</span><b>'+(span!=null?span+'일':'')+'</b></div>';
      }).join("");
  }

  // ---------- detail sheet ----------
  function openDetail(id){
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    openDetailId = id;
    var b=$("sheetbody");

    if(!ownerView()){
      // 직원 화면: 재고 수량 · 오픈 병 관리
      b.innerHTML = ''+
        '<h3>'+esc(it.name)+'</h3>'+
        '<div class="sub">'+esc(it.brand||"")+(it.form?' · '+esc(it.form):'')+' · 최소재고 '+(it.min||0)+'</div>'+
        '<div class="field"><label>현재고 (직접 입력)</label>'+
          '<input id="d-stock" type="number" inputmode="numeric" min="0" value="'+(it.stock||0)+'"></div>'+
        openControlHTML(it)+
        '<button class="savebtn" id="d-ssave">저장</button>'+
        '<div class="row2" style="margin-top:10px">'+
          '<button class="savebtn" id="d-in" style="background:var(--ok)">＋1 입고</button>'+
          '<button class="savebtn" id="d-out" style="background:var(--danger)">－1 출고</button>'+
        '</div>'+
        (it.note?'<div class="kv" style="margin-top:14px"><span>비고</span><b>'+esc(it.note)+'</b></div>':'')+
        '<div class="kv"><span>마지막 변경</span><b>'+(it.updatedBy?esc(it.updatedBy)+" · "+timeShort(it.updatedAt):"–")+'</b></div>'+
        openHistoryHTML(it);
      wireOpenControl(it);
      $("d-ssave").onclick=function(){
        if(!me){ needName(); return; }
        var nv=Math.max(0, Number($("d-stock").value)||0), from=it.stock||0;
        var before={open:it.open, openedAt:it.openedAt, openLog:it.openLog};
        var patch={};
        if(from!==nv) patch.stock=nv;
        var op=collectOpenPatch(it); if(op){ for(var k in op) patch[k]=op[k]; }
        if(!Object.keys(patch).length){ closeSheet(); return; }
        patch.updatedAt=nowISO(); patch.updatedBy=me;
        db.doc("items/"+id).update(patch).then(function(){
          if(patch.stock!=null) logStockDelta(it.name, from, nv, "직접입력");
          logOpenPatch(it.name, op);
          closeSheet();
          if(op) showUndoToast(openActionText(op, it.name), function(){ undoOpen(id, before, it.name); });
          else showToast("저장됐어요");
        }).catch(function(){ showToast("저장 실패"); });
      };
      $("d-in").onclick=function(){ bump(id,1); closeSheet(); };
      $("d-out").onclick=function(){ bump(id,-1); closeSheet(); };
      openSheet();
      return;
    }

    // 사장 화면: 원가 · 최소재고 · 비고 · 삭제
    var c = costMap[id] || {};
    var marginRow = "";
    if(c.cost!=null && it.bottle!=null){
      var mg = it.bottle - c.cost, rate = Math.round(mg/it.bottle*100);
      marginRow = '<div class="margin"><span>보틀 마진</span><b class="'+(rate<30?"low":"")+'">'+won(mg)+' ('+rate+'%)</b></div>';
    }
    b.innerHTML = ''+
      '<h3>'+esc(it.name)+'</h3>'+
      '<div class="sub">'+esc(it.brand||"")+(it.form?' · '+esc(it.form):'')+' · '+esc(it.unit||"병")+' 단위</div>'+
      '<div class="field"><label>현재고 (직접 입력)</label>'+
        '<input id="d-stock" type="number" inputmode="numeric" min="0" value="'+(it.stock||0)+'"></div>'+
      '<div class="kv"><span>판매가 (잔/보틀)</span><b>'+(it.glass!=null?won(it.glass):"–")+' / '+(it.bottle!=null?won(it.bottle):"–")+' <span style="color:var(--ink-dim);font-weight:400">· 테이블 탭 &gt; 메뉴 판매가 관리에서 수정</span></b></div>'+
      '<div class="costbox">'+
        '<div class="ct">원가 (사장만 보임)</div>'+
        '<input id="c-cost" type="number" inputmode="numeric" placeholder="병당 매입가 (원)" value="'+(c.cost!=null?c.cost:"")+'">'+
        '<input id="c-costnote" placeholder="거래처·메모 (선택)" value="'+esc(c.note||"")+'" style="margin-top:8px">'+
        '<div id="c-margin">'+marginRow+'</div>'+
      '</div>'+
      '<div class="field"><label>최소 재고 (이 아래면 발주 필요)</label>'+
        '<div class="minset"><button id="min-dec">−</button><span class="v" id="min-v">'+(it.min||0)+'</span><button id="min-inc">+</button></div></div>'+
      openControlHTML(it)+
      '<div class="field"><label>비고</label><textarea id="d-note" placeholder="예: 3병 입고 · 1병 파손">'+esc(it.note||"")+'</textarea></div>'+
      '<div class="kv"><span>마지막 변경</span><b>'+(it.updatedBy?esc(it.updatedBy)+" · "+timeShort(it.updatedAt):"–")+'</b></div>'+
      openHistoryHTML(it)+
      '<button class="savebtn" id="d-save" style="margin-top:14px">저장</button>'+
      '<button class="delbtn" id="d-del">이 품목 삭제</button>';

    var m = it.min||0;
    wireOpenControl(it);
    $("min-dec").onclick=function(){ m=Math.max(0,m-1); $("min-v").textContent=m; };
    $("min-inc").onclick=function(){ m=m+1; $("min-v").textContent=m; };
    $("c-cost").addEventListener("input", function(){
      var cost=Number(this.value);
      if(this.value && it.bottle!=null){
        var mg=it.bottle-cost, r=Math.round(mg/it.bottle*100);
        $("c-margin").innerHTML='<div class="margin"><span>보틀 마진</span><b class="'+(r<30?"low":"")+'">'+won(mg)+' ('+r+'%)</b></div>';
      } else { $("c-margin").innerHTML=""; }
    });
    $("d-save").onclick=function(){
      if(!me){ needName(); return; }
      var note=$("d-note").value.trim();
      var nv=Math.max(0, Number($("d-stock").value)||0);
      var from=it.stock||0;
      var costV=$("c-cost").value, costNote=$("c-costnote").value.trim();
      var costEntry = {}; costEntry[id] = {
        cost: costV===""?null:Number(costV), note:costNote, updatedAt:nowISO()
      };
      var before={open:it.open, openedAt:it.openedAt, openLog:it.openLog};
      var itemPatch = {stock:nv, min:m, note:note, updatedAt:nowISO(), updatedBy:me};
      var op=collectOpenPatch(it); if(op){ for(var k in op) itemPatch[k]=op[k]; }
      Promise.all([
        db.doc("items/"+id).update(itemPatch),
        db.doc("cost/all").update({items:costEntry})
      ]).then(function(){
        if(nv!==from) logStockDelta(it.name, from, nv, "직접입력"); else addLog(it.name+" 정보 수정");
        logOpenPatch(it.name, op);
        closeSheet();
        if(op) showUndoToast(openActionText(op, it.name), function(){ undoOpen(id, before, it.name); });
        else showToast("저장됐어요");
      }).catch(function(){ showToast("저장 실패"); });
    };
    var armed=false;
    $("d-del").onclick=function(){
      if(!me){ needName(); return; }
      if(!armed){ armed=true; $("d-del").textContent="정말 삭제할까요? 한 번 더 누르기"; return; }
      db.doc("items/"+id).delete()
        .then(function(){ addLog(it.name+" 품목 삭제"); closeSheet(); showToast("삭제됐어요"); })
        .catch(function(){ showToast("삭제 실패"); });
    };
    openSheet();
  }

  function openAdd(){
    if(!ownerView()) return;
    var b=$("sheetbody");
    b.innerHTML = ''+
      '<h3>새 품목 추가</h3><div class="sub">재고 장부에만 추가됩니다 (메뉴판과 별개)</div>'+
      '<div class="field"><label>분류</label><select id="a-cat">'+

  function fmtToday(){

    return (d.getMonth()+1)+"/"+d.getDate()+" ("+["일","월","화","수","목","금","토"][d.getDay()]+")";

  // ============ 테이블 / 매출 ============
  function itemPrices(it){
    var out=[];
    if(it.form==="단일가" || it.form==="GLASS ONLY" || it.bottle==null){
      if(it.glass!=null) out.push({opt:"", price:it.glass});
      if(it.bottle!=null) out.push({opt:"병", price:it.bottle});
    } else {
      if(it.glass!=null) out.push({opt:"잔", price:it.glass});
      if(it.bottle!=null) out.push({opt:"병", price:it.bottle});
    }
    return out;
  }
  function menuList(){
    return items.filter(function(it){ return it.glass!=null || it.bottle!=null; })
      .sort(function(a,b){
        var ai=MENU_SEQ.indexOf(a.cat); if(ai<0) ai=99;
        var bi=MENU_SEQ.indexOf(b.cat); if(bi<0) bi=99;
        return ai-bi || (a.order||0)-(b.order||0);
      });
  }
  function tableLines(n){ var t=tables[String(n)]; return (t&&t.lines)||[]; }
  function linesTotal(ls){ return ls.reduce(function(s,l){ return s + (l.price||0)*(l.qty||0); }, 0); }

  function switchView(v){

  // ============ 근태 ============
  function renderAttendance(){
    $("att-me").textContent = me || "이름을 입력하세요";
    var el=$("att-log");
    var ents = (attToday && attToday.entries) || [];
    if(!ents.length){ el.innerHTML='<li style="border:0;color:var(--ink-dim)">오늘 기록 없음</li>'; return; }
    el.innerHTML = ents.slice().reverse().map(function(e){
      return '<li class="attrow"><span class="tag '+(e.type==="in"?"in":"out")+'">'+(e.type==="in"?"출근":"퇴근")+'</span>'+
        '<span>'+esc(e.name||"?")+'</span><span class="t">'+hm(e.at)+'</span></li>';
    }).join("");
  }
  function punch(type){
    if(!me){ needName(); return; }
    if(!db){ showToast("동기화 연결 후 가능해요"); return; }
    var date=localISO(new Date());
    var last=null;
    ((attToday&&attToday.entries)||[]).forEach(function(e){ if(e.name===me) last=e; });
    if(last && last.type===type){
      showToast("이미 "+(type==="in"?"출근":"퇴근")+" 기록이 있어요 ("+hm(last.at)+")");
      return;
    }
    appendDailyDoc("attendance/"+date, function(d){
      var entries=(d.entries||[]).concat([{ name:me, type:type, at:nowISO() }]);
      return { date:date, entries:entries, updatedAt:nowISO() };
    }).then(function(){
      addLog(me+" "+(type==="in"?"출근":"퇴근"));
      showToast((type==="in"?"출근":"퇴근")+" 기록 · "+hm(nowISO()));
    }).catch(function(){ showToast("기록 실패 · 다시 시도해주세요"); });
  }
  function attHours(entries){
    // 사람별로 in/out 쌍 지어 근무시간(분) 합산
    var byName={};
    (entries||[]).forEach(function(e){ (byName[e.name]=byName[e.name]||[]).push(e); });
    var out={};
    Object.keys(byName).forEach(function(nm){
      var list=byName[nm].slice().sort(function(a,b){ return new Date(a.at)-new Date(b.at); });
      var mins=0, openIn=null, first=null, lastT=null;
      list.forEach(function(e){
        if(!first) first=e.at; lastT=e.at;
        if(e.type==="in"){ openIn=e.at; }
        else if(e.type==="out" && openIn){ mins += Math.max(0,(new Date(e.at)-new Date(openIn))/60000); openIn=null; }
      });
      out[nm]={ mins:Math.round(mins), first:first, last:lastT, dangling:!!openIn };
    });
    return out;
  }
  function fmtDur(mins){ var h=Math.floor(mins/60), m=Math.round(mins%60); return h+"시간"+(m?" "+m+"분":""); }

  function openAttHistory(){
    if(!db){ showToast("동기화 연결 후 가능해요"); return; }
    var b=$("sheetbody");
    b.innerHTML='<h3>근태 내역</h3><div class="sub">불러오는 중…</div>';
    openSheet();
    db.collection("attendance").orderBy("date","desc").limit(100).get().then(function(snap){
      var docs=snap.docs.map(function(x){return x.data()||{};}).filter(function(d){return d.date;});
      if(!docs.length){ b.innerHTML='<h3>근태 내역</h3><div class="sub">아직 기록이 없어요</div>'; return; }
      var view=new Date(); view.setDate(1); view.setHours(0,0,0,0);
      function paint(){
        var y=view.getFullYear(), mo=view.getMonth();
        var monthDocs=docs.filter(function(d){ var p=d.date.split("-"); return +p[0]===y && +p[1]===mo+1; })
          .sort(function(a,c){ return a.date<c.date?1:-1; });
        // 사람별 월 합계
        var per={};
        monthDocs.forEach(function(d){
          var h=attHours(d.entries);
          Object.keys(h).forEach(function(nm){
            if(!per[nm]) per[nm]={mins:0, days:0, dangling:0};
            per[nm].mins += h[nm].mins; per[nm].days += 1;
            if(h[nm].dangling) per[nm].dangling += 1;
          });
        });
        var names=Object.keys(per).sort();
        b.innerHTML = '<h3>근태 내역</h3>'+
          '<div class="calnav"><button id="ah-prev">‹</button><b>'+y+'.'+(mo+1)+'</b><button id="ah-next">›</button></div>'+
          '<div class="atth2">이 달 근무 합계</div>'+
          (names.length ? names.map(function(nm){
            var p=per[nm];
            return '<div class="kv"><span>'+esc(nm)+' <span style="color:var(--ink-dim)">'+p.days+'일'+(p.dangling?' · 퇴근누락 '+p.dangling:'')+'</span></span>'+
              '<b>'+fmtDur(p.mins)+' <span style="color:var(--ink-dim);font-weight:400">('+(p.mins/60).toFixed(1)+'h)</span></b></div>';
          }).join("") : '<div class="sub">기록 없음</div>')+
          (dl && monthDocs.length ? '<button class="linkbtn" id="ah-csv" style="margin:10px 0">이 달 근태 CSV 내려받기</button>' : '')+
          '<div class="atth2" style="margin-top:16px">일자별</div>'+
          (monthDocs.length ? monthDocs.map(function(d){
            var h=attHours(d.entries), tot=0;
            Object.keys(h).forEach(function(nm){ tot+=h[nm].mins; });
            return '<button class="pick-item" data-date="'+d.date+'"><span class="pi-n">'+d.date.slice(5).replace("-","/")+' · '+Object.keys(h).length+'명</span><span class="pi-p">'+fmtDur(tot)+'</span></button>';
          }).join("") : '<div class="sub">이 달 기록 없음</div>');
        $("ah-prev").onclick=function(){ view.setMonth(view.getMonth()-1); paint(); };
        $("ah-next").onclick=function(){ view.setMonth(view.getMonth()+1); paint(); };
        var csvb=$("ah-csv");
        if(csvb) csvb.onclick=function(){ attMonthCSV(monthDocs, y, mo); };
        Array.prototype.forEach.call(b.querySelectorAll("[data-date]"), function(el){
          el.onclick=function(){
            var dt=el.getAttribute("data-date");
            showAttDay(dt, docs.filter(function(d){return d.date===dt;})[0]);
          };
        });
      }
      paint();
    }).catch(function(){ b.innerHTML='<h3>근태 내역</h3><div class="sub">불러오기 실패</div>'; });
  }
  function attMonthCSV(monthDocs, y, mo){
    if(!dl) return;
    var head=["날짜","이름","첫 출근","마지막 퇴근","근무(분)","근무(시간)","비고"];
    var lines=[head.join(",")];
    monthDocs.slice().sort(function(a,c){ return a.date<c.date?-1:1; }).forEach(function(d){
      var h=attHours(d.entries);
      Object.keys(h).sort().forEach(function(nm){
        var x=h[nm];
        var r=[d.date, nm, hm(x.first), x.dangling?"":hm(x.last), x.mins, (x.mins/60).toFixed(2), x.dangling?"퇴근 미기록":""];
        lines.push(r.map(function(v){ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","));
      });
    });
    dl.save({ filename:"다이닝사운드_근태_"+y+"-"+pad2(mo+1)+".csv", data:"﻿"+lines.join("\n") })
      .catch(function(e){ if(e && e.code!=="declined") showToast("내려받기 실패"); });
  }
  function showAttDay(date, d){
    d=d||{};
    var b=$("sheetbody");
    var editing = ownerView();          // 직원은 조회만, 사장만 수정/삭제
    var work=(d.entries||[]).map(function(e){ return {name:e.name, type:e.type, at:e.at}; });
    var back='<button class="linkbtn" id="ah-back" style="padding:6px 0 12px">‹ 목록으로</button>';

    function isoAt(hhmm){ var p=(date+"T"+(hhmm||"12:00")+":00").split("T"); var dt=new Date(p[0]+"T00:00:00"); var t=(hhmm||"12:00").split(":"); dt.setHours(+t[0],+t[1],0,0); return dt.toISOString(); }

    function draw(){
      var hrs=attHours(work), names=Object.keys(hrs).sort();
      var summary = names.length ? names.map(function(nm){
        var h=hrs[nm];
        return '<div class="kv"><span>'+esc(nm)+' <span style="color:var(--ink-dim)">'+hm(h.first)+'~'+(h.dangling?"미기록":hm(h.last))+'</span></span>'+
          '<b>'+fmtDur(h.mins)+' <span style="color:var(--ink-dim);font-weight:400">('+(h.mins/60).toFixed(1)+'h)</span></b></div>';
      }).join("") : '<div class="sub">기록 없음</div>';

      var order=work.map(function(e,i){return i;}).sort(function(a,c){ return new Date(work[a].at)-new Date(work[c].at); });
      var rawList = order.map(function(i){
        var e=work[i];
        if(!editing){
          return '<div class="attrow"><span class="tag '+(e.type==="in"?"in":"out")+'">'+(e.type==="in"?"출근":"퇴근")+'</span><span>'+esc(e.name||"?")+'</span><span class="t">'+hm(e.at)+'</span></div>';
        }
        return '<div class="attrow" style="gap:6px">'+
          '<select data-i="'+i+'" data-k="type" style="border:1px solid var(--line);border-radius:6px;padding:5px;font-size:12px;background:var(--ground)"><option value="in"'+(e.type==="in"?" selected":"")+'>출근</option><option value="out"'+(e.type==="out"?" selected":"")+'>퇴근</option></select>'+
          '<input data-i="'+i+'" data-k="name" value="'+esc(e.name||"")+'" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px;background:var(--ground)">'+
          '<input data-i="'+i+'" data-k="time" type="time" value="'+hm(e.at)+'" style="border:1px solid var(--line);border-radius:6px;padding:5px 3px;font-size:12px;background:var(--ground)">'+
          '<button class="tl-x" data-del="'+i+'">✕</button></div>';
      }).join("") || '<div class="sub">기록 없음</div>';

      b.innerHTML = back+'<h3>'+date+' 근태</h3>'+ summary +
        '<div class="atth2" style="margin-top:16px">'+(editing?"기록 수정 (사장)":"전체 기록")+'</div>'+ rawList +
        (editing ? '<div class="row2" style="margin-top:10px">'+
            '<button class="savebtn" id="ad-in" style="background:var(--surface-2);color:var(--ink)">＋ 출근</button>'+
            '<button class="savebtn" id="ad-out" style="background:var(--surface-2);color:var(--ink)">＋ 퇴근</button></div>'+
          '<button class="savebtn" id="ad-save" style="margin-top:10px">저장</button>' : '');
      $("ah-back").onclick=openAttHistory;

      if(editing){
        Array.prototype.forEach.call(b.querySelectorAll("[data-i]"), function(inp){
          inp.addEventListener("change", function(){
            var i=+inp.getAttribute("data-i"), k=inp.getAttribute("data-k");
            if(k==="type") work[i].type=inp.value;
            else if(k==="name") work[i].name=inp.value.trim();
            else if(k==="time") work[i].at=isoAt(inp.value);
          });
        });
        Array.prototype.forEach.call(b.querySelectorAll("[data-del]"), function(x){
          x.onclick=function(){ work.splice(+x.getAttribute("data-del"),1); draw(); };
        });
        $("ad-in").onclick=function(){ work.push({name:me||"", type:"in", at:isoAt(hm(nowISO()))}); draw(); };
        $("ad-out").onclick=function(){ work.push({name:me||"", type:"out", at:isoAt(hm(nowISO()))}); draw(); };
        $("ad-save").onclick=function(){
          if(!me){ needName(); return; }
          var clean=work.filter(function(e){ return e.name; });
          var w = clean.length
            ? db.doc("attendance/"+date).set({date:date, entries:clean, updatedAt:nowISO(), updatedBy:me})
            : db.doc("attendance/"+date).delete();
          w.then(function(){
            addLog(me+" "+date+" 근태 수정");
            db.doc("attendance/"+date).get().then(function(s){ showAttDay(date, s.exists?(s.data()||{}):{}); });
            showToast("저장됐어요");
          }).catch(function(){ showToast("저장 실패"); });
        };
      }
    }
    draw();
  }

  function openTable(n){
    if(!db){ showToast("동기화 연결 후 사용 가능해요"); return; }
    var lines = tableLines(n).map(function(l){ return {id:l.id||"", name:l.name, opt:l.opt||"", price:l.price, qty:l.qty}; });
    function persist(){
      db.doc("tables/"+n).set({ n:n, lines:lines, updatedAt:nowISO(), updatedBy:me||"" }).catch(function(){});
    }
    function draw(){
      var b=$("sheetbody");
      b.innerHTML = '<h3>'+n+'번 테이블</h3>'+
        '<div class="sub">손님 계산 참고용 · 메뉴 판매가 기준</div>'+
        (lines.length ? lines.map(function(l,i){
          return '<div class="tline">'+
            '<div class="tl-n">'+esc(l.name)+(l.opt?' <span class="tl-opt">'+esc(l.opt)+'</span>':'')+'</div>'+
            '<div class="tl-q"><button data-act="qd" data-i="'+i+'">−</button><span>'+l.qty+'</span><button data-act="qi" data-i="'+i+'">＋</button></div>'+
            '<div class="tl-a">'+won(l.price*l.qty)+'</div>'+
            '<button class="tl-x" data-act="rm" data-i="'+i+'">✕</button>'+
          '</div>';
        }).join("") : '<div class="empty" style="padding:22px 0">담긴 품목이 없어요</div>')+
        '<button class="savebtn" id="t-add" style="background:var(--surface-2);color:var(--ink);margin-top:10px">＋ 품목 추가</button>'+
        '<div class="kv tot" style="font-size:16px;margin-top:16px"><span>합계</span><span>'+won(linesTotal(lines))+'</span></div>'+
        (lines.length ? '<div id="t-donewrap"><button class="delbtn" id="t-done" style="border-color:var(--brand);color:var(--brand)">계산 완료</button></div>'+
          '<button class="linkbtn" id="t-clear" style="color:var(--ink-dim)">테이블 비우기 (매출 기록 안 함)</button>' : '');
      Array.prototype.forEach.call(b.querySelectorAll("[data-act]"), function(el){
        el.onclick=function(){
          if(!me){ needName(); return; }
          var i=+el.getAttribute("data-i"), a=el.getAttribute("data-act");
          if(a==="qd") lines[i].qty=Math.max(1, lines[i].qty-1);
          else if(a==="qi") lines[i].qty++;
          else if(a==="rm") lines.splice(i,1);
          persist(); draw();
        };
      });
      $("t-add").onclick=function(){
        if(!me){ needName(); return; }
        openItemPicker(function(p){
          var ex=null;
          for(var k=0;k<lines.length;k++){ if(lines[k].id===p.id && lines[k].opt===p.opt){ ex=lines[k]; break; } }
          if(ex) ex.qty++; else lines.push({id:p.id, name:p.name, opt:p.opt, price:p.price, qty:1});
          persist();
        }, draw);
      };
      var d=$("t-done");
      if(d){
        d.onclick=function(){
          if(!me){ needName(); return; }
          var wrap=$("t-donewrap");
          wrap.innerHTML =
            '<div style="font-size:12px;color:var(--ink-dim);font-weight:700;margin:12px 0 6px">매출 날짜 (전날 매출이면 변경)</div>'+
            '<input id="t-date" type="date" value="'+localISO(new Date())+'" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ground);margin-bottom:10px">'+
            '<div style="font-size:12px;color:var(--ink-dim);font-weight:700;margin:0 0 7px">결제 수단</div>'+
            '<div class="row2">'+
              '<button class="savebtn" data-pay="카드" style="background:var(--surface-2);color:var(--ink)">카드</button>'+
              '<button class="savebtn" data-pay="현금" style="background:var(--surface-2);color:var(--ink)">현금</button>'+
            '</div>'+
            '<button class="linkbtn" data-pay="기타" style="margin-top:2px;text-align:center">기타 / 미수</button>';
          Array.prototype.forEach.call(wrap.querySelectorAll("[data-pay]"), function(pb){
            pb.onclick=function(){ finalize(pb.getAttribute("data-pay")); };
          });
        };
      }
      var tcl=$("t-clear");
      if(tcl){ var clArmed=false;
        tcl.onclick=function(){
          if(!clArmed){ clArmed=true; tcl.textContent="정말 비우기? 한 번 더 (매출 기록 안 됨)"; return; }
          lines.length=0; persist();
          addLog((me||"?")+" "+n+"번 테이블 비움 (기록 없음)");
          closeSheet(); showToast("테이블 비웠어요");
        };
      }
      function finalize(pay){
        var tot=linesTotal(lines), soldLines=lines.slice();
        var today=localISO(new Date());
        var date=($("t-date") && $("t-date").value) || today;
        var wrap=$("t-donewrap");
        if(wrap) wrap.innerHTML='<div class="sub" style="padding:8px 0">처리 중…</div>';
        recordSale(n, soldLines, tot, pay, date).then(function(){
          if(date===today) return applyStockForSale(soldLines, n);  // 과거 날짜는 재고 자동차감 안 함
        }).then(function(){
          lines.length=0; persist();
          addLog(n+"번 테이블 계산 완료 · "+date+" · "+won(tot)+" · "+pay);
          closeSheet(); showToast("계산 완료 · "+won(tot)+" · "+pay);
        }).catch(function(err){
          console.warn("계산 완료 실패", err);
          var code = err && err.code ? err.code : (err && err.message ? err.message : "");
          showToast("매출 기록 실패"+(code?" ("+code+")":"")+" · 테이블에 그대로 담겨있어요, 다시 시도해주세요");
          draw();
        });
      }
    }
    draw();
    openSheet();
  }

  function recordSale(n, lines, total, pay, dateOverride){
    if(!db) return Promise.reject({code:"unavailable", message:"동기화 연결 안 됨"});
    var date = dateOverride || localISO(new Date());
    return appendDailyDoc("sales/"+date, function(d){
      var orders = d.orders || [];
      orders.push({ t:n, at:nowISO(), by:me||"", total:total, pay:pay||"기타",
        lines: lines.map(function(l){ return {name:l.name, opt:l.opt||"", qty:l.qty, price:l.price}; }) });
      return { date:date, orders:orders, total:(d.total||0)+total, count:(d.count||0)+1, updatedAt:nowISO() };
    });
  }

  // 날짜별 문서에 이어붙이기: 읽기→쓰기 + 실패 시 재시도 (lease 없이 — 소규모 매장이라 동시 계산 거의 없음)
  function appendDailyDoc(path, mutateFn, tries){
    tries = tries==null ? 4 : tries;
    var ref=db.doc(path);
    return ref.get().then(function(s){
      return ref.set(mutateFn(s.exists ? (s.data()||{}) : {}));
    }).catch(function(e){
      if(tries>0) return new Promise(function(r){ setTimeout(r, 250 + Math.random()*350); })
        .then(function(){ return appendDailyDoc(path, mutateFn, tries-1); });
      throw e;
    });
  }

  // 재고 수량이 바뀔 때마다: 변경 로그 + 일자별 재고내역(stockLog)에 기록
  function logStockDelta(itemName, from, to, source){
    addLog(itemName+" 재고 "+from+" → "+to+(source?" · "+source:""));
    if(!db || from===to) return;
    var date=localISO(new Date());
    appendDailyDoc("stockLog/"+date, function(d){
      var entries=(d.entries||[]).concat([{ ts:nowISO(), who:me||"", item:itemName, from:from, to:to, source:source||"수동" }]);
      return { date:date, entries:entries, updatedAt:nowISO() };
    }).catch(function(){});
  }

  // 테이블 계산 완료 시 재고 자동 반영: 병 판매는 재고 -1, 잔 판매는 오픈 상태만 표시
  function applyStockForSale(lines, tableN){
    if(!db) return Promise.resolve();
    var work={};
    lines.forEach(function(l){
      if(!l.id) return;
      var it=items.find(function(x){return x.id===l.id;});
      if(!it || it.notrack) return;
      if(l.opt==="병"){
        work[l.id]=work[l.id]||{};
        work[l.id].stockDelta=(work[l.id].stockDelta||0) - l.qty;
      } else if(l.opt==="잔"){
        if(!it.open){ work[l.id]=work[l.id]||{}; work[l.id].doOpen=true; }
      } else if(!l.opt && it.unit!=="케그" && it.unit!=="잔" && it.min!=null){
        work[l.id]=work[l.id]||{};
        work[l.id].stockDelta=(work[l.id].stockDelta||0) - l.qty;
      }
    });
    var ids=Object.keys(work);
    if(!ids.length) return Promise.resolve();
    return Promise.all(ids.map(function(id){
      var it=items.find(function(x){return x.id===id;}); if(!it) return Promise.resolve();
      var w=work[id], patch={ updatedAt:nowISO(), updatedBy:me||"테이블" };
      var from=it.stock||0, to=from;
      if(w.stockDelta){ to=Math.max(0, from+w.stockDelta); patch.stock=to; }
      if(w.doOpen){ patch.open=true; patch.openedAt=nowISO(); }
      return db.doc("items/"+id).update(patch).then(function(){
        if(w.stockDelta) logStockDelta(it.name, from, to, (tableN?tableN+"번 테이블 판매":"테이블 판매"));
        if(w.doOpen) addLog(it.name+" 판매로 자동 오픈 표시");
      });
    }));
  }

  function wonK(n){
    n = n||0;
    if(n>=10000) return (n/10000).toFixed(n>=1000000?0:1).replace(/\.0$/,"")+"만";
    if(n>0) return Math.round(n/1000)+"천";
    return "";
  }

  // 오늘 시재 (사장 전용): 시작 시재 + 현금 매출 - 지출 = 예상 시재, 실사 금액과 비교
  function openTill(date){
    if(!db){ showToast("동기화 연결 후 가능해요"); return; }
    date = date || localISO(new Date());
    var isToday = date === localISO(new Date());
    var b=$("sheetbody");
    b.innerHTML = '<h3>시재 · '+date+'</h3><div class="sub">불러오는 중…</div>';
    openSheet();
    Promise.all([
      db.doc("till/"+date).get(),
      isToday ? Promise.resolve(null) : db.doc("sales/"+date).get(),
      db.doc("meta/tillDefault").get()
    ]).then(function(res){
      var t = res[0].exists ? (res[0].data()||{}) : {};
      var sd = isToday ? todaySales : (res[1] && res[1].exists ? res[1].data() : null);
      var def = (res[2].exists && res[2].data().opening) || 0;
      var cardT=0, cashT=0, otherT=0;
      ((sd&&sd.orders)||[]).forEach(function(o){
        if(o.pay==="카드") cardT+=o.total; else if(o.pay==="현금") cashT+=o.total; else otherT+=(o.total||0);
      });
      var opening0 = t.opening!=null ? t.opening : def;
      function calc(){
        var op=Number($("tl-open").value)||0, out=Number($("tl-out").value)||0;
        var exp=op+cashT-out;
        var cv=$("tl-counted").value, cnt = cv===""?null:Number(cv);
        $("tl-expected").textContent = won(exp);
        $("tl-diff").textContent = cnt==null ? "–" : won(cnt-exp);
        $("tl-deposit").textContent = cnt==null ? won(exp-op)+" (예상)" : won(cnt-op);
      }
      b.innerHTML = '<h3>시재 · '+date+(isToday?" (오늘)":"")+'</h3>'+
        '<div class="field"><label>시작 시재 (그날 캐시박스에 넣어둔 돈)</label>'+
          '<input id="tl-open" type="number" inputmode="numeric" value="'+(t.opening!=null?t.opening:(def||""))+'" placeholder="예: 200000"></div>'+
        '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);margin:-4px 0 12px">'+
          '<input type="checkbox" id="tl-default" style="width:16px;height:16px;accent-color:var(--brand)">이 금액을 매일 기본 시작 시재로 저장</label>'+
        '<div class="kv"><span>카드 매출</span><b>'+won(cardT)+'</b></div>'+
        '<div class="kv"><span>현금 매출</span><b>'+won(cashT)+'</b></div>'+
        (otherT?'<div class="kv"><span>기타/미수</span><b>'+won(otherT)+'</b></div>':'')+
        '<div class="field" style="margin-top:10px"><label>현금 지출 (거스름돈 교환 제외한 실지출)</label>'+
          '<input id="tl-out" type="number" inputmode="numeric" value="'+(t.paidOut!=null?t.paidOut:"")+'" placeholder="0"></div>'+
        '<div class="kv tot" style="font-size:15px;margin-top:6px"><span>예상 마감 현금 (시작+현금매출−지출)</span><span id="tl-expected">'+won(opening0+cashT-(t.paidOut||0))+'</span></div>'+

  // ---------- CSV ----------
  function downloadCSV(rows, base){
    var head = ["분류","브랜드","품목명","단위","현재고","최소재고","오픈","잔가","보틀가"];
    if(ownerView()) head = head.concat(["원가","보틀마진","거래처메모"]);
    head = head.concat(["비고","마지막수정자","마지막수정"]);
    var lines = [head.join(",")];
    rows.forEach(function(it){
      var r=[CAT_KO[it.cat]||it.cat, it.brand||"", it.name||"", it.unit||"", it.stock||0, it.min||0,
        it.open?"O":"", it.glass||"", it.bottle||""];
      if(ownerView()){
        var c=costMap[it.id]||{};
        var mg = (c.cost!=null && it.bottle!=null)? (it.bottle-c.cost) : "";
        r=r.concat([c.cost!=null?c.cost:"", mg, c.note||""]);
      }
      r=r.concat([(it.note||"").replace(/\n/g," "), it.updatedBy||"",
        it.updatedAt? new Date(it.updatedAt).toLocaleString("ko-KR"):""]);
      lines.push(r.map(function(v){ v=String(v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }).join(","));
    });
    var today = new Date().toISOString().slice(0,10).replace(/-/g,"");
    dl.save({filename: base+"_"+today+".csv", data: "﻿"+lines.join("\n")})
      .catch(function(e){ if(e && e.code!=="declined") showToast("내려받기 실패"); });
  }

  // ---------- seed ----------
  function seedBody(s){
    var b = { cat:s.cat, brand:s.brand||"", name:s.name, form:s.form||"",
      unit:s.unit||"병", stock:s.stock||0, min:s.min||0, open:!!s.open,
      note:s.note||"", order:s.o, updatedAt:nowISO(), updatedBy:"기준값" };
    if(s.glass!=null) b.glass=s.glass;
    if(s.bottle!=null) b.bottle=s.bottle;
    if(s.notrack) b.notrack=true;
    return b;
  }
  // 몇 개씩 나눠 순차 기록 (호출 속도 제한 회피). 실패한 항목은 다음 실행에서 재시도.
  function seedChunk(list, i){
    if(i>=list.length) return Promise.resolve();
    var part=list.slice(i, i+3);
    return Promise.all(part.map(function(s){
      return db.doc("items/r"+s.o).set(seedBody(s)).catch(function(){ return null; });
    })).then(function(){ return new Promise(function(r){ setTimeout(r, 300); }); })
      .then(function(){ return seedChunk(list, i+3); });
  }
  function runSeed(force){
    if(!db || seedingActive) return;
    seedingActive=true; render();
    db.collection("items").get().then(function(snap){
      var have={}; snap.docs.forEach(function(d){ have[d.id]=true; });
      var missing = SEED.filter(function(s){ return force ? true : !have["r"+s.o]; });
      if(!missing.length){ seedingActive=false; render(); return; }
      return db.doc("meta/log").get().then(function(l){
        if(!l.exists) return db.doc("meta/log").set({entries:[]});
      }).then(function(){ return seedChunk(missing, 0); })
        .then(function(){ return db.collection("items").get(); })
        .then(function(snap){
          if(snap.size >= SEED.length){
            return db.doc("meta/state").set({seeded:true, v:SEED_VERSION, at:nowISO()})
              .then(function(){ seededOnce=true; }).catch(function(){});
          }
        })
        .then(function(){ seedingActive=false; showToast("기준 재고 불러옴"); render(); });
    }).catch(function(){ seedingActive=false; render(); });
  }

  function applyMode(){
    document.body.classList.toggle("owner", ownerView());
    var badge=$("modebadge");
    if(!badge) return;
    if(isOwner){
      badge.textContent = previewStaff ? "직원 화면 미리보기 · 탭하면 복귀" : "사장";
      badge.style.cursor = "pointer";
    } else {
      badge.textContent = "직원";
      badge.style.cursor = "default";
    }
  }

  // ---------- 다운로드 (일반 브라우저) ----------
  function blobSave(req){
    return new Promise(function(res, rej){
      try{
        var blob = new Blob([req.data], {type:"text/csv;charset=utf-8;"});
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = req.filename || "download.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
        res({status:"saved"});
      }catch(e){ rej({code:"failed", message:String(e)}); }
    });
  }

  // ---------- 모드 뱃지 (사장이 직원 화면 잠깐 미리보기) ----------
  function wireBadge(){
    $("modebadge").addEventListener("click", function(){
      if(!isOwner) return;
      previewStaff = !previewStaff;
      applyMode(); render();
      if(openDetailId) openDetail(openDetailId);
    });
  }

  // ---------- PIN 인증 ----------
  function rememberRole(r, p){ try{ localStorage.setItem("ds_role", r); localStorage.setItem("ds_pin", p); }catch(e){} }
  function showGate(){
    $("gate").classList.remove("hidden");
    $("g-msg").textContent = "코드를 입력하세요";
    $("g-pin").hidden = false; $("g-go").hidden = false;
    $("g-hint").textContent = "사장 코드 / 직원 코드";
    $("g-pin").focus();
  }
  function hideGate(){ $("gate").classList.add("hidden"); }
  function submitPin(){
    var v=($("g-pin").value||"").trim();
    if(v && accessCfg.ownerPin && v===accessCfg.ownerPin){ isOwner=true; rememberRole("owner",v); enterApp(); return; }
    if(v && accessCfg.staffPin && v===accessCfg.staffPin){ isOwner=false; rememberRole("staff",v); enterApp(); return; }
    var p=$("g-pin"); p.classList.add("wrong"); p.value=""; $("g-msg").textContent="코드가 맞지 않아요";
  }
  function logout(){
    try{ localStorage.removeItem("ds_role"); localStorage.removeItem("ds_pin"); }catch(e){}
    location.reload();
  }
  function openPinSettings(){
    if(!ownerView()) return;
    var b=$("sheetbody");
    b.innerHTML = '<h3>코드 설정</h3><div class="sub">직원에겐 <b>직원 코드</b>만 알려주세요. 사장 코드로 들어오면 원가·매출·근태 수정이 보입니다.</div>'+
      '<div class="field"><label>사장 코드 (필수)</label><input id="pin-owner" type="tel" inputmode="numeric" maxlength="8" value="'+esc(accessCfg.ownerPin||"")+'"></div>'+
      '<div class="field"><label>직원 코드</label><input id="pin-staff" type="tel" inputmode="numeric" maxlength="8" value="'+esc(accessCfg.staffPin||"")+'"></div>'+
      '<button class="savebtn" id="pin-save">저장</button>';
    $("pin-save").onclick=function(){
      var o=($("pin-owner").value||"").trim(), s=($("pin-staff").value||"").trim();
      if(!o){ showToast("사장 코드는 필수예요"); return; }
      if(o===s){ showToast("사장/직원 코드는 달라야 해요"); return; }
      db.doc("config/access").set({ownerPin:o, staffPin:s, updatedAt:nowISO()}, {merge:true}).then(function(){
        accessCfg.ownerPin=o; accessCfg.staffPin=s; rememberRole("owner", o);
        closeSheet(); showToast("코드 저장됐어요");
      }).catch(function(){ showToast("저장 실패"); });
    };
    openSheet();
  }

  function enterApp(){
    hideGate();
    $("att-me") && ($("att-me").textContent = me || "이름을 입력하세요");
    applyMode();
    subscribeAll();
  }

  function start(){
    applyMode();
    renderChips();
    setSync("wait","연결 중");
    try{ firebase.initializeApp(FIREBASE_CONFIG); }catch(e){ console.warn(e); }
    db = firebase.firestore();
    dl = { save: blobSave };
    $("csvbtn").hidden = false;
    wireBadge();
    $("g-go").addEventListener("click", submitPin);
    $("g-pin").addEventListener("keydown", function(e){ if(e.key==="Enter") submitPin(); });

    firebase.auth().signInAnonymously()
      .catch(function(e){ console.warn("익명 로그인 미설정:", e && e.code); })
      .then(function(){ return db.doc("config/access").get(); })
      .then(function(s){
      accessCfg = (s.exists && s.data()) || {};
      var savedRole=null, savedPin=null;
      try{ savedRole=localStorage.getItem("ds_role"); savedPin=localStorage.getItem("ds_pin"); }catch(e){}

      if(!accessCfg.ownerPin && !accessCfg.staffPin){
        // 최초 실행 — 이 접속을 사장으로, PIN 설정 유도
        isOwner = true;
        db.doc("config/access").set({ownerPin:"", staffPin:"", createdAt:nowISO()}).catch(function(){});
        enterApp();
        setTimeout(function(){ showToast("먼저 사장/직원 코드를 정하세요"); openPinSettings(); }, 900);
        return;
      }
      if(savedRole==="owner" && savedPin && savedPin===accessCfg.ownerPin){ isOwner=true; enterApp(); return; }
      if(savedRole==="staff" && savedPin && savedPin===accessCfg.staffPin){ isOwner=false; enterApp(); return; }
      showGate();
    }).catch(function(e){
      console.warn("firebase", e);
      setSync("off","연결 실패");
      $("gate").classList.remove("hidden");
      $("g-msg").textContent = "연결에 실패했어요. 잠시 후 새로고침 해주세요.";
      $("g-pin").style.display="none"; $("g-go").style.display="none";
      $("g-hint").textContent = (e && e.code) ? e.code : "";
    });
  }

  function subscribeAll(){
    if(subscribeAll._done) return;
    subscribeAll._done = true;

      db.doc("cost/all").onSnapshot(function(snap){
        costMap = (snap.exists && snap.data().items) || {};
        costReady = true;
        var pending = snap.metadata && snap.metadata.hasPendingWrites;
        if(openDetailId && !pending) openDetail(openDetailId);
        render();
      }, function(){});

      db.doc("meta/state").get().then(function(s){ seededOnce = !!(s.exists && s.data().seeded && s.data().v===SEED_VERSION); }).catch(function(){});

      var healed=false;
      db.collection("items").onSnapshot(function(snap){
        items = snap.docs.map(function(x){ var v=x.data()||{}; return {
          id:x.id, order:v.order||0, cat:v.cat, brand:v.brand, name:v.name, form:v.form,
          glass:v.glass, bottle:v.bottle, unit:v.unit, stock:v.stock||0, min:v.min||0,
          open:!!v.open, openedAt:v.openedAt||null, openLog:v.openLog||[], notrack:!!v.notrack,
          note:v.note||"", updatedAt:v.updatedAt, updatedBy:v.updatedBy
        }; });
        var live = !(snap.metadata && snap.metadata.fromCache);
        setSync(live ? "on" : "wait", live ? "동기화됨" : "동기화 중");
        render();
        // 아직 한 번도 완전히 시드된 적 없고 품목이 덜 들어와 있으면 한 번 채운다
        if(live && !healed && !seededOnce && !seedingActive && items.length < SEED.length){
          healed=true; runSeed(false);
        }
      }, function(err){ setSync("off","동기화 오류"); console.warn("items",err); });

      db.doc("meta/log").onSnapshot(function(snap){
        logEntries = (snap.exists && snap.data().entries) || [];
        renderLog();
      }, function(){});

      db.collection("closings").orderBy("date","desc").limit(10).onSnapshot(function(snap){
        closings = snap.docs.map(function(x){ return x.data()||{}; });
        renderCloseLog();
      }, function(){});

      db.collection("tables").onSnapshot(function(snap){
        tables={}; snap.docs.forEach(function(x){ tables[x.id]=x.data()||{}; });
        if(currentView==="tables") renderTables();
      }, function(){});

      db.doc("sales/"+localISO(new Date())).onSnapshot(function(snap){
        todaySales = snap.exists ? (snap.data()||null) : null;
        var el=$("salesbtn");
        if(el) el.textContent = "매출 내역 (오늘 "+won((todaySales&&todaySales.total)||0)+")";
      }, function(){});

      db.doc("attendance/"+localISO(new Date())).onSnapshot(function(snap){
        attToday = snap.exists ? (snap.data()||null) : null;
        if(currentView==="att") renderAttendance();
      }, function(){});
  }

  start();
})();
</script>
</body>
</html>
